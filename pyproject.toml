[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbridge"
version = "0.1.0"
description = "Client for the rbridge daemon: use the agent runtimes installed on your machine from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Source = "https://github.com/runtime-bridge/rbridge-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rbridge = ["py.typed"]
